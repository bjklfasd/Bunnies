    <div class="loading-screen" id="loading-screen">
      <img src="assets/images/bunnies.png" alt="Bunnies logo" class="loading-logo" />
      <div class="loading-text" id="loading-text">Bunnies</div>
    </div>
    <div class="stars"></div>

    <div class="app-layout">
      <nav>
        <div class="nav-top">
          <img src="assets/images/bunnies.png" alt="Bunnies logo" class="logo-img" />
        </div>
        <ul class="nav-links">
          <li><a href="/" title="Home"><i class="fa-solid fa-house"></i></a></li>

          <li><a href="settings.html" title="Options" class="active"><i class="fa-solid fa-gear"></i></a></li>
        </ul>
      </nav>

      <main>
        <header class="page-header">
          <div class="page-top">
            <div class="page-title">
              <span>Options</span>
            </div>
            <div class="page-badge">Settings</div>
          </div>
        </header>

        <div class="settings-container">
          <section class="settings-section">
            <h2><i class="fas fa-palette"></i> Themes</h2>
            <p>Choose a theme for the entire site</p>
            <div class="theme-grid">
              <div class="theme-card" data-theme="default">
                <div class="theme-preview" style="background: linear-gradient(135deg, #000000 0%, #050510 100%);"></div>
                <div class="theme-name">Default</div>
              </div>
              <div class="theme-card" data-theme="midnight">
                <div class="theme-preview" style="background: linear-gradient(135deg, #1a0f2e 0%, #0f0820 100%);"></div>
                <div class="theme-name">Midnight</div>
              </div>
              <div class="theme-card" data-theme="crimson">
                <div class="theme-preview" style="background: linear-gradient(135deg, #1a0a0a 0%, #0f0505 100%);"></div>
                <div class="theme-name">Crimson</div>
              </div>
            </div>
          </section>

          <section class="settings-section">
            <h2><i class="fas fa-mask"></i> Tab Cloaking</h2>
            <p>Change the tab favicon and title</p>
            <div class="cloak-group">
              <div>
                <label class="cloak-label">Preset</label>
                <select id="cloakPreset" class="cloak-select">
                  <option value="" data-title="">Custom</option>
                  <option value="assets/images/icons/google.ico" data-title="Google">Google</option>
                  <option value="assets/images/icons/gmail.ico" data-title="Gmail">Gmail</option>
                  <option value="assets/images/icons/googleclassroom.ico" data-title="Home">Google Classroom</option>
                  <option value="assets/images/icons/googledrive.ico" data-title="My Drive">Google Drive</option>
                  <option value="assets/images/icons/desmos.ico" data-title="Desmos | Graphing Calculator">Desmos</option>
                  <option value="assets/images/icons/wikipedia.ico" data-title="Wikipedia">Wikipedia</option>
                  <option value="assets/images/icons/bing.ico" data-title="Bing">Bing</option>
                  <option value="assets/images/icons/chromenewtab.ico" data-title="New Tab">Chrome New Tab</option>
                </select>
              </div>
              <div>
                <label class="cloak-label">Favicon URL</label>
                <input type="text" id="faviconInput" class="cloak-input" placeholder="assets/images/icons/google.ico" />
              </div>
              <div>
                <label class="cloak-label">Tab Title</label>
                <input type="text" id="titleInput" class="cloak-input" placeholder="Bunnies" />
              </div>
              <div class="cloak-btn-group">
                <button id="applyCloak" class="cloak-btn"><i class="fas fa-check"></i> Apply</button>
                <button id="resetCloak" class="cloak-btn secondary"><i class="fas fa-undo"></i> Reset</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
